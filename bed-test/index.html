<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>3D кровать</title>
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@4.1.0/dist/model-viewer.min.js"></script>
<style>
html,body{margin:0;width:100%;height:100%;background:#f4f2ee;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{display:flex;flex-direction:column;overflow:hidden}
header{padding:12px 16px;background:white;border-bottom:1px solid #ddd;z-index:2}
h1{font-size:18px;margin:0 0 3px}
p{font-size:13px;color:#666;margin:0}
#status{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:#fff;padding:12px 16px;border-radius:12px;box-shadow:0 4px 18px rgba(0,0,0,.12);z-index:3;font-size:14px}
model-viewer{width:100%;flex:1;background:#fff;min-height:0}
</style>
</head>
<body>
<header><h1>3D-модель кровати</h1><p>Вращай пальцем или мышью. Масштаб — щипком или колесом.</p></header>
<div id="status">Загружаю 3D-модель…</div>
<model-viewer id="viewer" camera-controls auto-rotate shadow-intensity="1" exposure="1" environment-image="neutral" interaction-prompt="auto" alt="3D-модель кровати"></model-viewer>
<script>
(async()=>{
  const status=document.getElementById('status');
  try{
    let b64='';
    for(let i=0;i<18;i++){
      const r=await fetch('model/part'+String(i).padStart(2,'0')+'.txt?1');
      if(!r.ok) throw new Error('chunk '+i);
      b64+=await r.text();
      status.textContent='Загружаю 3D-модель… '+Math.round((i+1)/18*100)+'%';
    }
    const bin=atob(b64);
    const bytes=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
    const url=URL.createObjectURL(new Blob([bytes],{type:'model/gltf-binary'}));
    const viewer=document.getElementById('viewer');
    viewer.src=url;
    viewer.addEventListener('load',()=>{status.style.display='none';},{once:true});
    viewer.addEventListener('error',()=>{status.textContent='Не удалось открыть 3D-модель';},{once:true});
  }catch(e){
    status.textContent='Ошибка загрузки 3D-модели';
  }
})();
</script>
</body>
</html>
